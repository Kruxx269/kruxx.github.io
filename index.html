<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #12151c;
    --text: #e8eaf0;
    --muted: #8890a0;
    --accent: #7c9cff;
    --border: #1f2430;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 3rem 5%;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-size: 1.75rem;
    font-weight: 600;
    margin-bottom: 0.4rem;
  }

  header p {
    color: var(--muted);
    font-size: 0.95rem;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 1rem;
    width: 100%;
    max-width: 700px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.1rem 1.25rem;
    color: var(--text);
    text-decoration: none;
    transition: border-color 0.15s ease, transform 0.15s ease;
  }

  .card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .card .icon {
    width: 34px;
    height: 34px;
    border-radius: 8px;
    background: rgba(124, 156, 255, 0.12);
    color: var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }

  .card .label {
    font-weight: 500;
    font-size: 0.95rem;
  }

  .card .sub {
    color: var(--muted);
    font-size: 0.78rem;
  }

  footer {
    margin-top: 3rem;
    color: var(--muted);
    font-size: 0.8rem;
  }
</style>
</head>
<body>

  <header>
    <h1>Home</h1>
    <p>Quick links to your services</p>
  </header>

  <div class="grid">
    <a href="#" class="card">
      <div class="icon">☁</div>
      <div>
        <div class="label">Service One</div>
        <div class="sub">service-one.example.com</div>
      </div>
    </a>

    <a href="#" class="card">
      <div class="icon">📁</div>
      <div>
        <div class="label">Service Two</div>
        <div class="sub">service-two.example.com</div>
      </div>
    </a>

    <a href="#" class="card">
      <div class="icon">📊</div>
      <div>
        <div class="label">Service Three</div>
        <div class="sub">service-three.example.com</div>
      </div>
    </a>

    <a href="#" class="card">
      <div class="icon">⚙</div>
      <div>
        <div class="label">Service Four</div>
        <div class="sub">service-four.example.com</div>
      </div>
    </a>
  </div>

  <footer>&copy; 2026 YourName</footer>

</body>
</html>
