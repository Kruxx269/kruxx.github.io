<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404...Page Not Found</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom blinking animation for the terminal cursor */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .animate-blink {
            animation: blink 1s step-end infinite;
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-600 font-mono min-h-screen flex items-center justify-center select-none">
    
    <!-- Centralized Container -->
    <div class="flex flex-col items-center text-center">
        
        <!-- 404 Error Segment -->
        <div class="mb-8">
            <h1 class="text-6xl font-bold tracking-widest mb-2">404</h1>
            <h2 class="text-lg tracking-widest uppercase">Page Not Found</h2>
        </div>

        <!-- Minimalist dormant message with cursor -->
        <div class="flex items-center">
            <p class="text-sm tracking-widest lowercase text-green-300 font-bold mr-2">Nothing to see here.</p>
            <span class="inline-block w-2.5 h-4 bg-gray-600 animate-blink"></span>
        </div>

    </div>

</body>
</html>
