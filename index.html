<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom blinking animation for the terminal cursor */
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .animate-blink {
            animation: blink 1s step-end infinite;
        }
    </style>
</head>
<body class="bg-[#050505] text-gray-600 font-mono min-h-screen flex items-center justify-center select-none">
    
    <!-- Minimalist dormant message with cursor -->
    <div class="text-center flex items-center">
        <p class="text-sm tracking-widest lowercase">nothing to see here.</p>
        <span class="inline-block w-2.5 h-4 bg-gray-600 ml-1 animate-blink"></span>
    </div>

</body>
</html>
